<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 World Cup Watchlist</title>
<style>
:root {
  --bg: #0b1020;
  --card: #151b2e;
  --card2: #1d2540;
  --text: #f5f7fb;
  --muted: #aab3c5;
  --accent: #79a7ff;
  --line: #2a3658;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(180deg, #080c18, #11172a);
  color: var(--text);
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(11,16,32,.96);
  border-bottom: 1px solid var(--line);
  padding: 18px;
}
.header-inner {
  max-width: 1100px;
  margin: 0 auto;
}
h1 {
  margin: 0 0 8px;
  font-size: 24px;
}
.stats {
  color: var(--muted);
  font-size: 14px;
  margin-top: 8px;
}
.share-note {
  color: var(--accent);
  font-size: 13px;
  margin-top: 6px;
  min-height: 18px;
}
.controls {
  display: grid;
  grid-template-columns: minmax(240px, 1fr) 150px 150px 155px 130px;
  gap: 10px;
  margin-top: 12px;
}
input, select, button {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
}
button {
  cursor: pointer;
  white-space: nowrap;
}
button:hover { background: var(--card2); }

main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 18px;
}
.date-block { margin-bottom: 18px; }
.date-title {
  font-size: 20px;
  margin: 18px 0 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}

/* Desktop row layout */
.game {
  display: grid;
  grid-template-columns: 120px 120px 95px minmax(260px, 1fr) 90px 70px;
  gap: 12px;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px;
  margin: 8px 0;
}
.game.watching { border-color: var(--accent); }
.game.important { box-shadow: 0 0 0 2px rgba(255,255,255,.12) inset; }

.check-wrap {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
}
.check {
  width: 20px;
  height: 20px;
  cursor: pointer;
}
.time {
  font-weight: 700;
  white-space: nowrap;
}
.match {
  font-size: 16px;
  font-weight: 700;
}
.meta {
  color: var(--muted);
  font-size: 13px;
  margin-top: 4px;
}
.badge {
  background: var(--card2);
  border: 1px solid var(--line);
  padding: 6px 8px;
  border-radius: 999px;
  text-align: center;
  font-size: 13px;
  white-space: nowrap;
}

/* Tablet */
@media (max-width: 900px) {
  header { position: static; }
  .controls {
    grid-template-columns: 1fr 1fr;
  }
  .controls input {
    grid-column: 1 / -1;
  }
  .game {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .time {
    grid-column: 1 / 2;
  }
  .match-info {
    grid-column: 1 / -1;
  }
  .badge {
    display: inline-block;
    text-align: left;
    width: fit-content;
  }
}

/* Phone */
@media (max-width: 560px) {
  h1 { font-size: 21px; }
  main { padding: 12px; }
  header { padding: 14px; }
  .controls {
    grid-template-columns: 1fr;
  }
  .game {
    grid-template-columns: 1fr;
    padding: 12px;
  }
  .match-info,
  .time {
    grid-column: auto;
  }
  .check-wrap {
    font-size: 14px;
  }
}
</style>
</head>
<body>

      <select id="groupFilter"><option value="">All groups</option></select>
      <button id="shareBtn">Copy Share Link</button>

  </div>
</header>

const WATCH_KEY = "wc2026-watch-picks-v3";
const IMPORTANT_KEY = "wc2026-important-picks-v3";

let watching = new Set(JSON.parse(localStorage.getItem(WATCH_KEY) || "[]"));
let important = new Set(JSON.parse(localStorage.getItem(IMPORTANT_KEY) || "[]"));

const app = document.getElementById("app");
const search = document.getElementById("search");
const dateFilter = document.getElementById("dateFilter");
const groupFilter = document.getElementById("groupFilter");
const stats = document.getElementById("stats");
const shareNote = document.getElementById("shareNote");

function loadFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const w = params.get("watch");
  const i = params.get("important");

  if (w || i) {
    watching = new Set((w || "").split(",").filter(Boolean).map(Number));
    important = new Set((i || "").split(",").filter(Boolean).map(Number));

    localStorage.setItem(WATCH_KEY, JSON.stringify([...watching]));
    localStorage.setItem(IMPORTANT_KEY, JSON.stringify([...important]));
  }
}

loadFromUrl();

  o.value = d;

});

[...new Set(games.map(g => g.group))].sort().forEach(g => {
  const o = document.createElement("option");
  o.value = g;
  o.textContent = g;
  groupFilter.appendChild(o);
});

function save() {
  localStorage.setItem(WATCH_KEY, JSON.stringify([...watching]));
  localStorage.setItem(IMPORTANT_KEY, JSON.stringify([...important]));
  updateStats();
}

function updateStats() {
  stats.textContent = `${watching.size} selected to watch • ${important.size} marked important • ${games.length} total matches`;
}

function makeShareLink() {
  const url = new URL(window.location.href);
  url.searchParams.set("watch", [...watching].sort((a,b) => a-b).join(","));
  url.searchParams.set("important", [...important].sort((a,b) => a-b).join(","));
  return url.toString();
}

async function copyShareLink() {
  const link = makeShareLink();

  try {
    await navigator.clipboard.writeText(link);
    shareNote.textContent = "Share link copied. Send that link through WhatsApp.";
  } catch (err) {
    shareNote.innerHTML = `Copy this link and send it through WhatsApp:<br><input value="${link}" style="width:100%;margin-top:6px" readonly onclick="this.select()">`;
  }
}

function matchesFilter(g) {
  const q = search.value.toLowerCase().trim();
  const text = `${g.date} ${g.time} ${g.match} ${g.group} ${g.stadium} ${g.channel}`.toLowerCase();
  return (!q || text.includes(q)) &&
         (!dateFilter.value || g.date === dateFilter.value) &&
         (!groupFilter.value || g.group === groupFilter.value);
}

function render() {
  app.innerHTML = "";
  const visible = games.filter(matchesFilter);
  const byDate = visible.reduce((acc, g) => {
    (acc[g.date] ||= []).push(g);
    return acc;
  }, {});

  for (const [date, list] of Object.entries(byDate)) {
    const block = document.createElement("section");
    block.className = "date-block";
    block.innerHTML = `<h2 class="date-title">${date}</h2>`;

    list.forEach(g => {
      const row = document.createElement("div");
      row.className = "game" + (watching.has(g.id) ? " watching" : "") + (important.has(g.id) ? " important" : "");
      row.innerHTML = `

        <label class="check-wrap"><input class="check important-check" type="checkbox" ${important.has(g.id) ? "checked" : ""}> Important</label>
        <div class="time">${g.time}</div>
        <div class="match-info">
          <div class="match">${g.match}</div>
          <div class="meta">${g.stadium}</div>
        </div>
        <div class="badge">${g.group}</div>
        <div class="badge">${g.channel}</div>
      `;

      const watchCb = row.querySelector(".watch-check");
      const importantCb = row.querySelector(".important-check");

      watchCb.addEventListener("change", () => {
        if (watchCb.checked) watching.add(g.id); else watching.delete(g.id);
        save();
        row.classList.toggle("watching", watchCb.checked);
      });

      importantCb.addEventListener("change", () => {
        if (importantCb.checked) important.add(g.id); else important.delete(g.id);
        save();
        row.classList.toggle("important", importantCb.checked);
      });

      block.appendChild(row);
    });

    app.appendChild(block);
  }

  if (!visible.length) app.innerHTML = "<p>No matches found.</p>";
  updateStats();
}

search.addEventListener("input", render);
dateFilter.addEventListener("change", render);
groupFilter.addEventListener("change", render);
document.getElementById("shareBtn").addEventListener("click", copyShareLink);
document.getElementById("clearBtn").addEventListener("click", () => {
  watching.clear();
  important.clear();
  save();
  render();
  shareNote.textContent = "";
});

render();
</script>
